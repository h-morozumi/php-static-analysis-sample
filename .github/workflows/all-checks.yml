name: All Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # SARIF アップロードに必要

jobs:
  setup:
    name: Setup and Install Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Generate cache key
        id: cache-key
        run: |
          KEY="${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}"
          echo "key=${KEY}" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

  psalm:
    name: Psalm Static Analysis
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Restore Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Psalm
        run: composer run psalm

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Restore Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        continue-on-error: true
        run: ./vendor/bin/phpstan analyse --no-progress --error-format=sarif > phpstan-results.sarif

      - name: Upload PHPStan SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: phpstan-results.sarif
          category: phpstan

      - name: Check PHPStan Result
        run: |
          ERRORS=$(jq '.runs[0].results | length' phpstan-results.sarif)
          echo "Found $ERRORS issue(s)"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::PHPStan detected $ERRORS issue(s)!"
            exit 1
          fi

  psalm-taint-analysis:
    name: Psalm Security Taint Analysis
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Restore Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Psalm Taint Analysis
        id: psalm-taint
        continue-on-error: true
        run: ./vendor/bin/psalm --no-cache --taint-analysis --report=results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: psalm-taint-analysis

      - name: Check Psalm Taint Analysis Result
        run: |
          ERRORS=$(jq '.runs[0].results | length' results.sarif)
          echo "Found $ERRORS security issue(s)"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Psalm Taint Analysis detected $ERRORS security vulnerabilities!"
            exit 1
          fi
